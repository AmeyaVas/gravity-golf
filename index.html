<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gravity Golf</title>
<style>
  :root{
    --bg:#05060d; --panel:#0d1020; --ink:#e8ecff; --muted:#8a91b4;
    --accent:#66e0ff; --good:#7CFFB2; --warn:#ff6b8b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% -20%, #141a33, var(--bg) 60%);
    color:var(--ink);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:16px; gap:12px; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  h1{font-size:15px; letter-spacing:.28em; font-weight:600; text-transform:uppercase;
     color:var(--muted)}
  h1 b{color:var(--accent); font-weight:600}
  #hud{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:stretch;
    width:min(900px,100%);
  }
  .chip{
    background:var(--panel); border:1px solid #1e2440; border-radius:10px;
    padding:8px 14px; display:flex; flex-direction:column; align-items:center; min-width:74px;
  }
  .chip .k{font-size:10px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
  .chip .v{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
  .chip .v.under{color:var(--good)}
  .chip .v.over{color:var(--warn)}
  #wrap{position:relative; width:min(900px,100%); aspect-ratio:3/2}
  canvas{
    width:100%; height:100%; display:block; border-radius:14px;
    border:1px solid #1e2440; background:#04050b; touch-action:none;
    box-shadow:0 20px 60px -20px #000;
  }
  #overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(4,5,11,.72); backdrop-filter:blur(3px); border-radius:14px; text-align:center;
  }
  #overlay .card{background:var(--panel); border:1px solid #2a315a; border-radius:16px;
    padding:26px 30px; max-width:340px}
  #overlay h2{font-size:22px; margin-bottom:6px}
  #overlay p{color:var(--muted); margin-bottom:16px}
  button{
    font:inherit; font-weight:600; color:#04121a; background:var(--accent);
    border:0; border-radius:9px; padding:10px 20px; cursor:pointer;
  }
  button.ghost{background:transparent; color:var(--muted); border:1px solid #2a315a}
  #bar{display:flex; gap:8px; width:min(900px,100%); justify-content:center; flex-wrap:wrap}
  #hint{color:var(--muted); font-size:12px; text-align:center; min-height:16px}
</style>
</head>
<body>
  <h1>Gravity <b>Golf</b></h1>

  <div id="hud">
    <div class="chip"><span class="k">Hole</span><span class="v" id="s-hole">1</span></div>
    <div class="chip"><span class="k">Par</span><span class="v" id="s-par">3</span></div>
    <div class="chip"><span class="k">Strokes</span><span class="v" id="s-str">0</span></div>
    <div class="chip"><span class="k">Total</span><span class="v" id="s-tot">E</span></div>
  </div>

  <div id="wrap">
    <canvas id="c" width="900" height="600"></canvas>
    <div id="overlay">
      <div class="card">
        <h2 id="ov-title">Hole complete</h2>
        <p id="ov-text">Nice putt.</p>
        <button id="ov-btn">Next hole</button>
      </div>
    </div>
  </div>

  <div id="bar">
    <button class="ghost" id="btn-retry">Replay hole</button>
    <button class="ghost" id="btn-reset">New game</button>
  </div>
  <div id="hint">Drag back from the ball and release to putt. Planets pull — use them.</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---------- course design ----------
// coords in the 900x600 canvas space
const HOLES = [
  { par:2, tee:{x:90,y:300}, cup:{x:810,y:300}, planets:[
      {x:450,y:300,r:46,type:'planet'} ] },
  { par:3, tee:{x:90,y:500}, cup:{x:820,y:110}, planets:[
      {x:360,y:330,r:52,type:'planet'},
      {x:640,y:220,r:34,type:'planet'} ] },
  { par:3, tee:{x:100,y:100}, cup:{x:800,y:500}, planets:[
      {x:450,y:300,r:70,type:'sun'} ] },
  { par:3, tee:{x:90,y:300}, cup:{x:810,y:300}, planets:[
      {x:340,y:170,r:40,type:'planet'},
      {x:560,y:430,r:40,type:'planet'} ] },
  { par:4, tee:{x:80,y:520}, cup:{x:830,y:80}, planets:[
      {x:300,y:360,r:44,type:'planet'},
      {x:480,y:250,r:38,type:'sun'},
      {x:660,y:170,r:40,type:'planet'} ] },
  { par:3, tee:{x:450,y:540}, cup:{x:450,y:70}, planets:[
      {x:330,y:300,r:40,type:'planet'},
      {x:570,y:300,r:40,type:'planet'} ] },
  { par:4, tee:{x:90,y:300}, cup:{x:815,y:300}, planets:[
      {x:300,y:300,r:30,type:'repulsor'},
      {x:470,y:300,r:60,type:'sun'},
      {x:640,y:300,r:30,type:'repulsor'} ] },
  { par:4, tee:{x:100,y:110}, cup:{x:800,y:110}, planets:[
      {x:250,y:330,r:44,type:'planet'},
      {x:450,y:180,r:30,type:'planet'},
      {x:650,y:340,r:44,type:'planet'} ] },
  { par:5, tee:{x:80,y:520}, cup:{x:830,y:520}, planets:[
      {x:260,y:330,r:46,type:'planet'},
      {x:450,y:470,r:36,type:'sun'},
      {x:470,y:180,r:40,type:'planet'},
      {x:670,y:340,r:46,type:'planet'} ] },
];

// ---------- physics constants ----------
const G = 2600;            // gravity strength
const BALL_R = 7;
const REST_SPEED = 6;      // below this (px/s) the ball is "at rest"
const SINK_SPEED = 250;    // must be slower than this at the cup mouth to get caught
const CUP_R = 16;          // visual cup radius
const CUP_MOUTH = 32;      // ball this close to the cup gets caught (if slow enough)
const CUP_PULL = 4200;     // strength of the cup's gravity well
const MAX_PULL = 190;      // px of drag
const LAUNCH_K = 4.2;      // drag px -> initial speed
const WALL_BOUNCE = 0.72;
const PLANET_BOUNCE = 0.6;
const FRICTION = 0.9;      // per second velocity damping (space dust) — sets putt range

function planetMass(p){ return p.r*p.r * (p.type==='sun'?1.7:1) * (p.type==='repulsor'?-1:1); }
function planetColor(p){
  if(p.type==='sun') return {a:'#ffd27a',b:'#ff7a3c',glow:'rgba(255,150,60,.28)'};
  if(p.type==='repulsor') return {a:'#9a7cff',b:'#4b2fae',glow:'rgba(120,90,255,.22)'};
  return {a:'#8fd0ff',b:'#2a5fae',glow:'rgba(90,150,255,.16)'};
}

// ---------- state ----------
let holeIdx = 0, strokes = 0, totalToPar = 0;
let ball, restPos, sunk, aiming, aimStart, aimNow, confetti = [], stars = [];
let flagWave = 0;

function makeStars(){
  stars = [];
  for(let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,
    s:Math.random()*1.4+0.2, t:Math.random()*6.28});
}
makeStars();

function loadHole(i){
  holeIdx = i;
  const h = HOLES[i];
  strokes = 0;
  ball = {x:h.tee.x, y:h.tee.y, vx:0, vy:0, alive:true, captured:false};
  restPos = {x:h.tee.x, y:h.tee.y};
  sunk = false; aiming = false; confetti = [];
  hideOverlay();
  syncHUD();
}

function syncHUD(){
  const h = HOLES[holeIdx];
  document.getElementById('s-hole').textContent = holeIdx+1;
  document.getElementById('s-par').textContent = h.par;
  document.getElementById('s-str').textContent = strokes;
  const t = document.getElementById('s-tot');
  t.textContent = totalToPar===0 ? 'E' : (totalToPar>0?'+'+totalToPar:totalToPar);
  t.className = 'v ' + (totalToPar<0?'under':totalToPar>0?'over':'');
}

// ---------- input ----------
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x:(p.clientX-r.left)/r.width*W, y:(p.clientY-r.top)/r.height*H };
}
function speed(o){ return Math.hypot(o.vx,o.vy); }
function ballAtRest(){ return speed(ball) < REST_SPEED; }

function onDown(e){
  if(sunk || !ballAtRest()) return;
  const p = canvasPos(e);
  if(Math.hypot(p.x-ball.x, p.y-ball.y) > 46) return; // must grab near ball
  aiming = true; aimStart = {x:ball.x,y:ball.y}; aimNow = p;
  e.preventDefault();
}
function onMove(e){
  if(!aiming) return;
  aimNow = canvasPos(e);
  e.preventDefault();
}
function onUp(e){
  if(!aiming) return;
  aiming = false;
  let dx = aimStart.x - aimNow.x, dy = aimStart.y - aimNow.y;
  let d = Math.hypot(dx,dy);
  if(d < 6) return;                       // tap, no shot
  d = Math.min(d, MAX_PULL);
  const ang = Math.atan2(dy,dx);
  const v = d * LAUNCH_K;
  ball.vx = Math.cos(ang)*v;
  ball.vy = Math.sin(ang)*v;
  strokes++;
  restPos = {x:ball.x, y:ball.y};
  syncHUD();
  e.preventDefault();
}
cv.addEventListener('mousedown',onDown); cv.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onUp);

document.getElementById('btn-retry').onclick = () => {
  // undo this hole's contribution isn't tracked mid-hole; just reload
  loadHole(holeIdx);
};
document.getElementById('btn-reset').onclick = () => {
  totalToPar = 0; loadHole(0);
};
document.getElementById('ov-btn').onclick = () => {
  if(holeIdx < HOLES.length-1) loadHole(holeIdx+1);
  else { totalToPar = 0; loadHole(0); }
};

function showOverlay(title, text, btn){
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-text').textContent = text;
  document.getElementById('ov-btn').textContent = btn;
  document.getElementById('overlay').style.display = 'flex';
}
function hideOverlay(){ document.getElementById('overlay').style.display = 'none'; }

// ---------- simulation ----------
function accelAt(x,y){
  let ax=0, ay=0;
  for(const p of HOLES[holeIdx].planets){
    const dx = p.x-x, dy = p.y-y;
    let d2 = dx*dx+dy*dy;
    const minD = p.r+BALL_R;
    if(d2 < minD*minD) d2 = minD*minD;
    const d = Math.sqrt(d2);
    const f = G * planetMass(p) / d2 / 300;
    ax += f*dx/d; ay += f*dy/d;
  }
  return {ax,ay};
}

function stepBall(dt){
  // substeps for stability
  const N = 6, h = dt/N;
  for(let s=0;s<N;s++){
    const cup0 = HOLES[holeIdx].cup;

    // captured: spiral deterministically into the cup, then drop
    if(ball.captured){
      const ex = cup0.x-ball.x, ey = cup0.y-ball.y;
      const cd = Math.hypot(ex,ey) || 0.001;
      if(cd < 2.5){ sink(); return; }
      const step = Math.max(cd * 0.12, 40*h);        // ease in, min crawl speed
      const px = ex/cd, py = ey/cd;
      const tx = -py, ty = px;                       // tangent -> slight orbit
      ball.x += px*step + tx*step*0.55;
      ball.y += py*step + ty*step*0.55;
      ball.vx = ball.vy = 0;
      continue;
    }

    const a = accelAt(ball.x, ball.y);
    ball.vx += a.ax*h; ball.vy += a.ay*h;
    // friction
    const damp = Math.max(0, 1 - FRICTION*h);
    ball.vx *= damp; ball.vy *= damp;
    ball.x += ball.vx*h; ball.y += ball.vy*h;

    // planet collisions / sun death
    for(const p of HOLES[holeIdx].planets){
      const dx = ball.x-p.x, dy = ball.y-p.y;
      const d = Math.hypot(dx,dy), minD = p.r+BALL_R;
      if(d < minD){
        if(p.type==='sun'){ killBall(); return; }
        const nx=dx/d, ny=dy/d;
        const vn = ball.vx*nx + ball.vy*ny;
        ball.vx -= (1+PLANET_BOUNCE)*vn*nx;
        ball.vy -= (1+PLANET_BOUNCE)*vn*ny;
        ball.x = p.x + nx*minD; ball.y = p.y + ny*minD;
      }
    }
    // walls
    if(ball.x < BALL_R){ ball.x=BALL_R; ball.vx=-ball.vx*WALL_BOUNCE; }
    if(ball.x > W-BALL_R){ ball.x=W-BALL_R; ball.vx=-ball.vx*WALL_BOUNCE; }
    if(ball.y < BALL_R){ ball.y=BALL_R; ball.vy=-ball.vy*WALL_BOUNCE; }
    if(ball.y > H-BALL_R){ ball.y=H-BALL_R; ball.vy=-ball.vy*WALL_BOUNCE; }

    // cup: pull nearby balls in; grab the ones that arrive on-target and not too fast
    const cup = HOLES[holeIdx].cup;
    const ex = cup.x-ball.x, ey = cup.y-ball.y;
    const cd = Math.hypot(ex,ey) || 0.001;
    if(cd < CUP_MOUTH){
      const pull = CUP_PULL / Math.max(cd*cd, 36);
      ball.vx += ex/cd * pull * h;
      ball.vy += ey/cd * pull * h;
      if(speed(ball) < SINK_SPEED) ball.captured = true;   // it's going in
    }
  }
}

function killBall(){
  ball.x = restPos.x; ball.y = restPos.y;
  ball.vx = 0; ball.vy = 0; ball.captured = false;
  flashHint("Burned up! Back to your last spot.");
}
let hintTimer = 0;
function flashHint(msg){
  document.getElementById('hint').textContent = msg;
  hintTimer = 2.4;
}

function sink(){
  sunk = true;
  ball.vx = ball.vy = 0;
  const cup = HOLES[holeIdx].cup;
  ball.x = cup.x; ball.y = cup.y;
  const h = HOLES[holeIdx];
  const diff = strokes - h.par;
  totalToPar += diff;
  syncHUD();
  let name = diff<=-3?'Albatross!!!':diff===-2?'Eagle!':diff===-1?'Birdie!':
             diff===0?'Par':diff===1?'Bogey':diff===2?'Double bogey':(diff)+' over';
  if(strokes===1) name = 'HOLE IN ONE!';
  if(strokes===1 || diff<0) burst();
  const last = holeIdx === HOLES.length-1;
  const totTxt = totalToPar===0?'even': totalToPar>0?totalToPar+' over par':(-totalToPar)+' under par';
  showOverlay(name,
    last ? `Final: ${totTxt}. Great round.` : `${strokes} stroke${strokes>1?'s':''} · you're ${totTxt}.`,
    last ? 'Play again' : 'Next hole');
}

// ---------- confetti ----------
function burst(){
  const cup = HOLES[holeIdx].cup;
  for(let i=0;i<90;i++){
    const a = Math.random()*6.28, sp = Math.random()*260+60;
    confetti.push({x:cup.x,y:cup.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,
      life:1, c:`hsl(${Math.random()*360},90%,65%)`, r:Math.random()*3+2});
  }
}

// ---------- render ----------
function draw(dt){
  ctx.clearRect(0,0,W,H);
  // stars
  for(const st of stars){
    st.t += dt*2;
    ctx.globalAlpha = 0.4 + Math.sin(st.t)*0.3;
    ctx.fillStyle = '#aab6ff';
    ctx.fillRect(st.x, st.y, st.s, st.s);
  }
  ctx.globalAlpha = 1;

  const h = HOLES[holeIdx];

  // planets
  for(const p of h.planets){
    const col = planetColor(p);
    const g = ctx.createRadialGradient(p.x,p.y,p.r*0.2,p.x,p.y,p.r*2.4);
    g.addColorStop(0,col.glow); g.addColorStop(1,'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.4,0,6.2832); ctx.fill();

    const rg = ctx.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.1,p.x,p.y,p.r);
    rg.addColorStop(0,col.a); rg.addColorStop(1,col.b);
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();

    if(p.type==='repulsor'){
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+6+Math.sin(flagWave*2)*3,0,6.2832); ctx.stroke();
    }
  }

  // cup + flag
  const cup = h.cup;
  ctx.fillStyle = '#03040a';
  ctx.beginPath(); ctx.arc(cup.x,cup.y,CUP_R,0,6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(124,255,178,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cup.x,cup.y,CUP_R,0,6.2832); ctx.stroke();
  ctx.strokeStyle = '#dfe6ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cup.x,cup.y); ctx.lineTo(cup.x,cup.y-40); ctx.stroke();
  flagWave += dt*4;
  const fw = Math.sin(flagWave)*3;
  ctx.fillStyle = '#7CFFB2';
  ctx.beginPath();
  ctx.moveTo(cup.x,cup.y-40);
  ctx.lineTo(cup.x+22,cup.y-34+fw);
  ctx.lineTo(cup.x,cup.y-28);
  ctx.fill();

  // aim / trajectory preview
  if(aiming){
    let dx = aimStart.x - aimNow.x, dy = aimStart.y - aimNow.y;
    let d = Math.min(Math.hypot(dx,dy), MAX_PULL);
    const ang = Math.atan2(dy,dx);
    const v = d*LAUNCH_K;
    // simulate
    let sx=ball.x, sy=ball.y, svx=Math.cos(ang)*v, svy=Math.sin(ang)*v;
    ctx.setLineDash([4,7]); ctx.strokeStyle='rgba(102,224,255,.75)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,sy);
    const hh = 1/120;
    for(let i=0;i<220;i++){
      const a = accelAt(sx,sy);
      svx += a.ax*hh; svy += a.ay*hh;
      sx += svx*hh; sy += svy*hh;
      if(sx<0||sx>W||sy<0||sy>H) break;
      let hit=false;
      for(const p of h.planets){ if(Math.hypot(sx-p.x,sy-p.y) < p.r+BALL_R){hit=true;break;} }
      ctx.lineTo(sx,sy);
      if(hit) break;
    }
    ctx.stroke(); ctx.setLineDash([]);
    // power arrow
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(ball.x,ball.y);
    ctx.lineTo(ball.x-Math.cos(ang)*d, ball.y-Math.sin(ang)*d); ctx.stroke();
    // power meter ring
    ctx.strokeStyle=`hsl(${140-140*(d/MAX_PULL)},90%,60%)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,13,-1.57,-1.57+6.2832*(d/MAX_PULL)); ctx.stroke();
  }

  // ball
  if(!sunk || true){
    ctx.save();
    ctx.shadowColor='rgba(160,200,255,.9)'; ctx.shadowBlur=12;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R,0,6.2832); ctx.fill();
    ctx.restore();
    // motion trail
    const sp = speed(ball);
    if(sp>40){
      ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(ball.x,ball.y);
      ctx.lineTo(ball.x-ball.vx*0.05, ball.y-ball.vy*0.05); ctx.stroke();
    }
  }

  // confetti
  for(const c of confetti){
    ctx.globalAlpha = Math.max(0,c.life);
    ctx.fillStyle = c.c;
    ctx.fillRect(c.x, c.y, c.r, c.r);
  }
  ctx.globalAlpha = 1;

  // "at rest, ready" indicator
  if(!sunk && ballAtRest() && !aiming){
    ctx.strokeStyle='rgba(102,224,255,.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,13+Math.sin(flagWave*2)*2,0,6.2832); ctx.stroke();
  }
}

// ---------- loop ----------
let prev = performance.now();
function frame(now){
  let dt = (now-prev)/1000; prev = now;
  if(dt>0.05) dt = 0.05;

  if(!sunk && !aiming && (ball.captured || !ballAtRest())) stepBall(dt);
  else if(!sunk && !aiming){
    // settle tiny residual drift
    ball.vx *= 0.7; ball.vy *= 0.7;
  }

  for(const c of confetti){
    c.vy += 380*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.life -= dt*0.5;
  }
  confetti = confetti.filter(c=>c.life>0);

  if(hintTimer>0){ hintTimer -= dt; if(hintTimer<=0)
    document.getElementById('hint').textContent =
      'Drag back from the ball and release to putt. Planets pull — use them.'; }

  draw(dt);
  requestAnimationFrame(frame);
}

if(location.hash === '#debug'){
  window.gg = {
    get ball(){ return ball; },
    get state(){ return {holeIdx, strokes, totalToPar, sunk, atRest:ballAtRest()}; },
    putt(vx,vy){ ball.vx=vx; ball.vy=vy; strokes++; restPos={x:ball.x,y:ball.y}; syncHUD(); },
    load: loadHole,
    sim(sec){ let n=Math.round(sec/0.016); for(let i=0;i<n && !sunk;i++) stepBall(0.016); return {x:ball.x,y:ball.y,v:speed(ball),sunk,strokes,captured:ball.captured,atRest:ballAtRest()&&!ball.captured}; }
  };
}

loadHole(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
